<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🫧 GESTURE BATTLE PRO — Jawab dengan Gerak!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1a3a; --navy2:#13244f; --panel:rgba(10,18,44,.82);
  --ink:#f4f6ff; --mut:#aab4d8; --gold:#ffc832; --blue:#3ec1ff;
  --green:#3ddc84; --red:#ff5e7d; --purple:#7c5cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;
  background:radial-gradient(120% 110% at 50% 0%,#1a2a5e 0%,var(--navy) 55%,#080f24 100%);
  color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
/* ---------- kamera latar ---------- */
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none;z-index:0;background:#000}
body.cam #cam{display:block}
#camov{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
body.cam #camov{display:block}
#camtag{position:fixed;top:1.6vmin;right:1.6vmin;z-index:8;background:rgba(0,0,0,.55);color:#c9ffd9;
  border:2px solid rgba(61,220,132,.5);border-radius:999px;padding:.8vmin 2vmin;font-size:2.2vmin;font-weight:600;display:none}
#camtag.show{display:block}
/* ---------- layar ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:auto;padding:3vmin;z-index:3}
.screen.active{display:flex}
/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:1.2vmin;font-weight:600;
  border:3px solid rgba(0,0,0,.28);border-radius:1.8vmin;background:rgba(255,255,255,.1);
  padding:1.8vmin 3vmin;font-size:2.8vmin;transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.big{padding:2.6vmin 4.4vmin;font-size:3.6vmin;border-radius:2.4vmin}
.btn.small{padding:1vmin 1.8vmin;font-size:2vmin;border-radius:1.2vmin}
.b-gold{background:var(--gold);color:#231a00}
.b-blue{background:var(--blue);color:#00202e}
.b-green{background:var(--green);color:#042512}
.b-ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- beranda ---------- */
.home-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:1.8vmin;text-align:center}
.title-main{font-size:8.6vmin;line-height:1.04;font-weight:700;text-shadow:0 .6vmin 0 rgba(0,0,0,.35)}
.title-main span{display:block;background:linear-gradient(90deg,var(--gold),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.title-sub{background:var(--purple);border-radius:999px;padding:1vmin 3vmin;font-size:2.6vmin;font-weight:600;color:#fff}
.menu-col{display:flex;flex-direction:column;gap:1.6vmin;margin-top:2vmin;width:min(64vmin,88vw)}
.mini-row{display:flex;gap:1.4vmin;justify-content:center}
.credit{position:absolute;bottom:2vmin;left:0;right:0;text-align:center;color:var(--mut);font-size:2vmin}
/* ---------- panel & form ---------- */
.panel{background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:2vmin;padding:2.4vmin;backdrop-filter:blur(6px)}
.inp{width:100%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);border-radius:1.2vmin;
  color:var(--ink);padding:1.6vmin 2vmin;font-size:2.4vmin;font-family:inherit;font-weight:500}
.inp:focus{outline:none;border-color:var(--gold)}
label.flab{display:block;font-size:2.1vmin;font-weight:600;color:var(--mut);margin:1.6vmin 0 .6vmin}
.chips{display:flex;flex-wrap:wrap;gap:1.2vmin}
.chip{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:999px;padding:1vmin 2.2vmin;font-size:2.3vmin;font-weight:600}
.chip.on{border-color:var(--gold);background:rgba(255,200,50,.16);color:var(--gold)}
.topbar{display:flex;align-items:center;gap:2vmin;margin-bottom:1.5vmin}
.topbar h2{font-size:3.6vmin}
.center-col{display:flex;flex-direction:column;gap:1.6vmin;max-width:96vmin;margin:0 auto;width:100%}
/* ---------- GAME: kartu soal & skor ---------- */
#scr-game{padding:0}
#qwrap{position:fixed;top:1.8vmin;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:.8vmin;pointer-events:none;width:min(92vw,120vmin)}
#chip-soal{background:rgba(8,14,36,.8);border:1.5px solid rgba(255,255,255,.25);color:#dfe6ff;border-radius:999px;padding:.5vmin 2.4vmin;font-size:2.1vmin;font-weight:600}
#qcard{background:linear-gradient(180deg,#7c5cff,#5f43e0);border:.45vmin solid rgba(255,255,255,.35);
  border-radius:2.4vmin;padding:1.6vmin 4vmin 2vmin;text-align:center;box-shadow:0 1vmin 3vmin rgba(0,0,0,.45)}
#qlbl{font-size:1.9vmin;font-weight:600;letter-spacing:.14em;color:#d9d2ff;text-transform:uppercase}
#qtext{font-size:3.8vmin;font-weight:700;line-height:1.15;text-shadow:0 .3vmin 0 rgba(0,0,0,.25)}
#tbar{width:min(60vmin,70vw);height:1vmin;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:999px}
.sc{position:fixed;top:1.8vmin;z-index:5;background:var(--panel);border:.45vmin solid var(--gold);
  border-radius:1.8vmin;padding:.8vmin 2.2vmin;text-align:center;min-width:15vmin;backdrop-filter:blur(4px)}
#sc-l{left:1.8vmin}
#sc-r{right:1.8vmin;border-color:var(--blue)}
.sc .lbl{font-size:1.9vmin;font-weight:700;letter-spacing:.08em}
#sc-l .lbl{color:var(--gold)}
#sc-r .lbl{color:var(--blue)}
.sc .val{font-size:4.6vmin;font-weight:700;line-height:1.05}
/* ---------- gelembung jawaban ---------- */
#bubbles{position:fixed;inset:0;z-index:4}
.bub{position:absolute;transform:translate(-50%,-50%);width:19vmin;height:19vmin;border-radius:50%;
  background:rgba(10,18,44,.78);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:2vmin;border:.55vmin solid var(--gold);box-shadow:0 .8vmin 2.4vmin rgba(0,0,0,.45),0 0 2vmin rgba(255,200,50,.25);
  animation:bob 3.2s ease-in-out infinite;cursor:pointer}
.bub.t1{border-color:var(--blue);box-shadow:0 .8vmin 2.4vmin rgba(0,0,0,.45),0 0 2vmin rgba(62,193,255,.25)}
.bub .bt{font-size:2.5vmin;font-weight:700;line-height:1.12;color:#fff;overflow-wrap:break-word;pointer-events:none}
.bub svg.pr{position:absolute;inset:-1.4vmin;width:calc(100% + 2.8vmin);height:calc(100% + 2.8vmin);transform:rotate(-90deg);pointer-events:none}
.bub svg.pr circle{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:314.2;stroke-dashoffset:314.2;stroke-linecap:round}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-1.2vmin}}
.bub.pop{animation:popout .32s ease-out forwards}
@keyframes popout{0%{transform:translate(-50%,-50%) scale(1)}60%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.bub.bad{border-color:#8a93b8 !important;background:rgba(60,66,92,.8)}
.bub.ok{border-color:var(--green) !important;box-shadow:0 0 3vmin rgba(61,220,132,.6)}
.bub.dim{opacity:.35}
/* ---------- hostbar, splash, hasil ---------- */
#hostbar{position:fixed;bottom:1.6vmin;left:1.6vmin;display:flex;gap:1vmin;z-index:8}
#hostbar .btn{width:6.2vmin;height:6.2vmin;padding:0;font-size:2.8vmin;border-radius:1.4vmin;background:rgba(10,18,44,.7)}
#splash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;pointer-events:none}
#splash.show{display:flex}
#splash span{font-size:14vmin;font-weight:700;color:var(--gold);text-shadow:0 .8vmin 0 rgba(0,0,0,.4);animation:zoomin .5s ease-out}
#splash span.ult{color:var(--green)}
@keyframes zoomin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.fdmg{position:fixed;z-index:9;font-size:5vmin;font-weight:700;color:var(--green);text-shadow:0 .4vmin 0 rgba(0,0,0,.4);pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-9vmin);opacity:0}}
#res{background:linear-gradient(180deg,#16264f 0%,#0c1734 100%)}
#res .box{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2.4vmin;text-align:center}
#res-title{font-size:6.4vmin;font-weight:700}
.rrow{display:flex;gap:3vmin;align-items:center}
.rbox{border:.5vmin solid var(--gold);border-radius:2vmin;padding:1.6vmin 3.4vmin;min-width:22vmin}
.rbox.t1{border-color:var(--blue)}
.rbox .rl{font-size:2.2vmin;font-weight:700;color:var(--gold)}
.rbox.t1 .rl{color:var(--blue)}
.rbox .rv{font-size:8vmin;font-weight:700}
#win-pill{background:var(--gold);color:#231a00;font-weight:700;font-size:3vmin;border-radius:2vmin;padding:1.6vmin 4vmin;box-shadow:0 .6vmin 2vmin rgba(255,200,50,.35)}
#win-pill.t1{background:var(--blue);color:#00202e}
/* ---------- modal & toast ---------- */
#modal-root{position:fixed;inset:0;background:rgba(5,9,24,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:3vmin}
#modal-root.open{display:flex}
.modal{background:#16224a;border:2px solid rgba(255,255,255,.14);border-radius:2vmin;padding:3vmin;width:min(76vmin,94vw);max-height:88vh;overflow:auto}
.modal h3{font-size:3.2vmin;margin-bottom:1.4vmin}
.modal p,.modal ol{font-size:2.3vmin;color:var(--mut);line-height:1.5}
.modal ol{margin:1vmin 0 1vmin 4.4vmin}
.mrow{display:flex;gap:1.4vmin;justify-content:flex-end;margin-top:2.2vmin;flex-wrap:wrap}
#toast{position:fixed;top:2vmin;left:50%;transform:translate(-50%,-16vmin);background:rgba(10,16,40,.95);
  border:2px solid var(--gold);color:var(--ink);border-radius:999px;padding:1.2vmin 3vmin;font-size:2.5vmin;
  font-weight:600;z-index:30;transition:transform .3s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.hint{color:var(--mut);font-size:2.1vmin;line-height:1.45}

</style>
</head>
<video id="cam" autoplay playsinline muted></video>
<canvas id="camov"></canvas>
<div id="camtag">⏳ Memuat AI…</div>

<!-- ================= BERANDA ================= -->
<section class="screen" id="scr-home">
  <div class="home-wrap">
    <h1 class="title-main">🫧 GESTURE BATTLE<span>PRO — JAWAB DENGAN GERAK!</span></h1>

</section>

<!-- ================= GAME ================= -->
<section class="screen" id="scr-game">
  <div class="sc" id="sc-l"><div class="lbl" id="sc-l-lbl">TIM KIRI</div><div class="val" id="sc-l-val">0</div></div>
  <div class="sc" id="sc-r"><div class="lbl" id="sc-r-lbl">TIM KANAN</div><div class="val" id="sc-r-val">0</div></div>

  <div id="hostbar">
    <button class="btn b-ghost" id="btn-snd">🔊</button>

</section>

<!-- ================= HASIL ================= -->
<section class="screen" id="res">
  <div class="box">
    <div id="res-title">Pertandingan Selesai!</div>
    <div class="rrow">
      <div class="rbox"><div class="rl" id="rb-l-lbl">TIM KIRI</div><div class="rv" id="rb-l-val">0</div></div>

      <button class="btn big b-green" id="btn-again">Main Lagi</button>
      <button class="btn big b-ghost" id="btn-menu">🏠 Menu</button>
    </div>
  </div>
</section>

<div id="modal-root"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script>
'use strict';
/* ================= UTIL ================= */
function $(s){return document.querySelector(s);}
function $$(s){return Array.from(document.querySelectorAll(s));}
function esc(s){return String(s==null?'':s);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[ri(0,arr.length-1)];}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=ri(0,i);[x[i],x[j]]=[x[j],x[i]];}return x;}
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
/* ================= BANK SOAL UMUM (3 tingkat × 12) ================= */
const UMUM1=[
 {q:'Singkatan dari HTML?',a:'HyperText Markup Language',w:['Home Tool Markup Language','Hyper Tab Main Language','High Text Machine Language']},
 {q:'Ibu kota Provinsi Jawa Tengah?',a:'Semarang',w:['Surakarta','Yogyakarta','Magelang']},
 {q:'Hasil 7 × 8 ?',a:'56',w:['54','48','63']},
 {q:'Planet terdekat dari Matahari?',a:'Merkurius',w:['Venus','Bumi','Mars']},
 {q:'Alat pernapasan ikan?',a:'Insang',w:['Paru-paru','Trakea','Kulit']},
 {q:'Lambang negara Indonesia?',a:'Garuda Pancasila',w:['Komodo','Bunga Melati','Monas']},
 {q:'Berapa sisi pada segitiga?',a:'3',w:['2','4','5']},
 {q:'Warna bendera Indonesia?',a:'Merah Putih',w:['Biru Kuning','Merah Biru','Putih Hijau']},
 {q:'Satu minggu berapa hari?',a:'7',w:['5','6','8']},
 {q:'Alat tulis untuk menghapus?',a:'Penghapus',w:['Pensil','Penggaris','Crayon']},
 {q:'Huruf vokal berjumlah?',a:'5',w:['4','6','21']},
 {q:'Air yang mendidih menjadi?',a:'Uap',w:['Es','Embun','Salju']}
];
const UMUM2=[
 {q:'Proklimasi kemerdekaan RI dibacakan tanggal?',a:'17 Agustus 1945',w:['1 Juni 1945','10 November 1945','28 Oktober 1928']},
 {q:'Singkatan dari CPU?',a:'Central Processing Unit',w:['Computer Personal Unit','Central Program Utility','Core Processing Unifier']},
 {q:'Penemu lampu listrik?',a:'Thomas Alva Edison',w:['Newton','Einstein','Graham Bell']},
 {q:'Gunung tertinggi di Indonesia?',a:'Puncak Jaya',w:['Semeru','Rinjani','Merapi']},
 {q:'Hasil dari 15% dari 200?',a:'30',w:['25','35','15']},
 {q:'Gas yang diserap tumbuhan?',a:'Karbon dioksida',w:['Oksigen','Nitrogen','Hidrogen']},
 {q:'Ibu kota Jepang?',a:'Tokyo',w:['Osaka','Kyoto','Beijing']},
 {q:'Alat musik dari Jawa Barat?',a:'Angklung',w:['Gamelan','Sasando','Kolintang']},
 {q:'Rumus luas lingkaran?',a:'π × r × r',w:['2 × π × r','π × d','4 × s']},
 {q:'Software presentasi Microsoft?',a:'PowerPoint',w:['Excel','Word','Access']},
 {q:'Pahlawan dari Aceh?',a:'Cut Nyak Dien',w:['Ki Hajar Dewantara','Pattimura','Sultan Hasanuddin']},
 {q:'Konversi 1 kilometer ke meter?',a:'1.000 m',w:['100 m','10.000 m','10 m']}
];
const UMUM3=[
 {q:'Organisasi PBB didirikan tahun?',a:'1945',w:['1948','1950','1939']},
 {q:'Singkatan dari URL?',a:'Uniform Resource Locator',w:['Universal Router Line','United Resource Link','Uniform Route Logic']},
 {q:'Tokoh Sang Saketi dalam wayang?',a:'Bima',w:['Arjuna','Yudhistira','Gatotkaca']},
 {q:'Bunyi kecepatan di udara ± ?',a:'340 m/s',w:['150 m/s','1.240 m/s','3.000 m/s']},
 {q:'Teorema Pythagoras untuk segitiga?',a:'Siku-siku',w:['Sama sisi','Tumpul','Lancip']},
 {q:'Presiden pertama RI?',a:'Soekarno',w:['Soeharto','Megawati','Habibie']},
 {q:'Perhitungan 2¹⁰ = ?',a:'1.024',w:['512','2.048','100']},
 {q:'Bahasa pemrograman untuk web statis?',a:'HTML',w:['Python','C++','Java']},
 {q:'Laut terluas di dunia?',a:'Samudra Pasifik',w:['Samudra Atlantik','Samudra Hindia','Samudra Arktik']},
 {q:'Peristiwa Sumpah Pemuda tahun?',a:'1928',w:['1945','1908','1966']},
 {q:'Satuan daya listrik?',a:'Watt',w:['Volt','Ampere','Ohm']},
 {q:'Ibukota Kalimantan Timur?',a:'Samarinda',w:['Balikpapan','Banjarmasin','Tanjung Selor']}
];
const UMUM={1:UMUM1,2:UMUM2,3:UMUM3};
/* ================= GENERATOR MATEMATIKA ================= */
function makeOpts(ans){
  const set=new Set([ans]);
  while(set.size<4){
    let d=ans+pick([-10,-9,-7,-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,7,9,10]);
    if(d<0)d=Math.abs(d)+1;
    if(d!==ans)set.add(d);
  }
  return shuffle(Array.from(set));
}
function genMath(lv){
  let a,b,ans,op;
  const r=Math.random();
  if(lv<=1){op=r<.5?'+':'−';a=ri(2,20);b=ri(1,op==='+'?20:a-1||1);ans=op==='+'?a+b:a-b;}
  else if(lv===2){
    if(r<.34){op='×';a=ri(3,12);b=ri(3,12);}
    else if(r<.67){op='+';a=ri(20,99);b=ri(10,89);}
    else{op='−';a=ri(30,99);b=ri(10,a-1);}
    ans=op==='×'?a*b:(op==='+'?a+b:a-b);
  }else{
    if(r<.4){op='×';a=ri(11,25);b=ri(4,15);}
    else if(r<.7){op='+';a=ri(120,899);b=ri(110,799);}
    else{op='−';a=ri(200,999);b=ri(100,a-50);}
    ans=op==='×'?a*b:(op==='+'?a+b:a-b);
  }
  const opts=makeOpts(ans);
  return {text:a+' '+op+' '+b+' = ?',opts:opts,correct:opts.indexOf(ans),ans:ans};
}
/* ================= SOAL GURU (bank berbagi seri) ================= */
function parseKuisTxt(t){
  const out=[];
  String(t||'').split(/\r?\n/).forEach(line=>{
    const parts=line.split('|').map(x=>x.trim()).filter(Boolean);
    if(parts.length<3||parts.length>5)return;
    const opts=parts.slice(1);
    out.push({text:parts[0],opts:opts,correct:0}); /* opsi pertama = benar */
  });
  return out;
}
let GURU_KUIS=[];
function loadGuruBanks(){GURU_KUIS=parseKuisTxt(LS.get('gb_guru_kuis',''));}
/* tanpa pengulangan sampai bank habis */
const usedMap=new Map();
function getUnused(key,bank){
  const used=usedMap.get(key)||new Set();
  let avail=bank.map((x,i)=>i).filter(i=>!used.has(i));
  if(!avail.length){used.clear();avail=bank.map((x,i)=>i);}
  const i=pick(avail);
  used.add(i);usedMap.set(key,used);
  return bank[i];
}
/* soal bank umum: buat opsi dari a/w */
function bankToQ(e,lv){
  const opts=shuffle([e.a,...e.w].slice(0,4));
  return {text:e.q,opts:opts,correct:opts.indexOf(e.a)};
}
function pickQ(cat){
  if(cat==='guru'){
    if(GURU_KUIS.length){
      const e=getUnused('guru',GURU_KUIS);
      const order=shuffle([0,1,2,3].slice(0,e.opts.length));
      const opts=order.map(i=>e.opts[i]);
      return {text:e.text,opts:opts,correct:order.indexOf(0)};
    }
    return genMath(pick([1,2,3]));
  }
  if(cat==='matematika')return genMath(pick([1,2,2,3]));
  if(cat==='umum'){const lv=pick([1,2,3]);return bankToQ(getUnused('u'+lv,UMUM[lv]),lv);}
  /* campur */
  if(Math.random()<.45)return genMath(pick([1,2,2,3]));
  const lv=pick([1,2,3]);
  return bankToQ(getUnused('u'+lv,UMUM[lv]),lv);
}

const Snd={
  on:true,ctx:null,
  ac(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return this.ctx;},
  tone(f,t,dur,type,vol){
    if(!this.on)return;
    const c=this.ac();if(!c)return;
    if(c.state==='suspended'){try{c.resume();}catch(e){}}
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol||.18,c.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.05);
  },
  click(){this.tone(600,0,.06,'triangle',.12);},
  lock(){this.tone(320,0,.05,'triangle',.08);},
  pop(){this.tone(880,0,.05,'square',.12);this.tone(1320,.03,.06,'square',.1);},
  correct(){this.tone(660,0,.09,'sine',.18);this.tone(880,.09,.12,'sine',.18);},
  wrong(){this.tone(200,0,.18,'sawtooth',.14);},
  tick(){this.tone(1000,0,.04,'square',.07);},
  go(){[523,659,784].forEach((f,i)=>this.tone(f,i*.09,.12,'triangle',.16));},
  fanfare(){[523,659,784,1046].forEach((f,i)=>this.tone(f,i*.13,.22,'triangle',.2));this.tone(1318,.55,.4,'sine',.18);},
  sad(){[392,330,262].forEach((f,i)=>this.tone(f,i*.15,.2,'sine',.15));}
};
/* ================= EFEK PARTIKEL ================= */
const FX={
  cv:null,cx:null,parts:[],
  init(){this.cv=$('#fx');if(!this.cv)return;this.cx=this.cv.getContext('2d');this.size();addEventListener('resize',()=>this.size());},
  size(){if(!this.cv)return;this.cv.width=innerWidth;this.cv.height=innerHeight;},
  burst(x,y,n){
    if(!this.cx)return;
    const cols=['#ffc832','#3ec1ff','#3ddc84','#ff5e7d','#c084fc'];
    for(let i=0;i<(n||30);i++){
      const a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
      this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,g:.22,r:2+Math.random()*4,c:pick(cols),l:40+Math.random()*30});
    }
  },
  rain(ms){this._rain=Date.now()+(ms||3000);},
  step(){
    if(!this.cx)return;
    if(Date.now()<(this._rain||0)){
      for(let i=0;i<4;i++)this.parts.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,r:2+Math.random()*4,c:pick(['#ffc832','#3ec1ff','#3ddc84','#ff5e7d']),l:120});
    }
    const cx=this.cx;
    cx.clearRect(0,0,this.cv.width,this.cv.height);
    this.parts=this.parts.filter(p=>p.l>0);
    for(const p of this.parts){
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;
      cx.globalAlpha=clamp(p.l/40,0,1);
      cx.fillStyle=p.c;
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    }
    cx.globalAlpha=1;
  }
};

function popBubble(b,team){

  const P=S.players[team];

    P.streak++;
    const speed=Math.ceil(clamp(S.timeLeft,0,cfg.time)/Math.max(1,cfg.time)*5);

    P.score+=pts;
    const c=bubbleCenter(b);
    FX.burst(c.x,c.y,60);
    floatPts(c.x,c.y,'+'+pts+bonus);

    S.phase='reveal';

async function camLoop(){

  if(!CAM.busy&&CAM.hands){
    const v=$('#cam');

      CAM.lastSend=performance.now();

function onHands(res){
  const g=$('#scr-game');
  if(!g||!g.classList.contains('active')||!CAM.on){handsLive.length=0;drawDots();return;}
  const now=performance.now();
  const lms=res.multiHandLandmarks||[];
  const sw=innerWidth,sh=innerHeight;
  const v=$('#cam');
  const vw=(v&&v.videoWidth)||1280,vh=(v&&v.videoHeight)||720;
  const sc=Math.max(sw/vw,sh/vh);
  const ox=(sw-vw*sc)/2,oy=(sh-vh*sc)/2;
  for(let i=0;i<2;i++){
    const L=lms[i];
    if(!L||!L[8]){continue;}
    const P=L[8];
    const rawX=ox+(1-P.x)*vw*sc;
    const rawY=oy+P.y*vh*sc;
    let h=handsLive[i];
    if(!h){h={x:rawX,y:rawY,team:i,frozenUntil:0,seen:0};handsLive[i]=h;}
    h.x+=(rawX-h.x)*.45;h.y+=(rawY-h.y)*.45;h.seen=now;h.team=i;
  }
  /* buang tangan hilang */
  for(let i=0;i<2;i++)if(handsLive[i]&&now-handsLive[i].seen>350)handsLive[i]=undefined;
  drawDots();
  dwellStep(now);
}
function drawDots(){
  const cv=$('#camov');
  if(!cv)return;
  const cx=cv.getContext('2d');
  cx.clearRect(0,0,cv.width,cv.height);
  handsLive.forEach(h=>{
    if(!h)return;
    const frozen=Date.now()<h.frozenUntil;
    const col=frozen?'#8a93b8':(h.team===0?'#ffc832':'#3ec1ff');
    cx.beginPath();cx.arc(h.x,h.y,22,0,Math.PI*2);cx.fillStyle=col+'44';cx.fill();
    cx.beginPath();cx.arc(h.x,h.y,9,0,Math.PI*2);cx.fillStyle=col;cx.fill();
    cx.lineWidth=3;cx.strokeStyle='#fff';cx.stroke();
  });
}
/* dwell: tangan mendekat ke gelembung warnanya sendiri */
function dwellStep(now){
  if(S.phase!=='ask')return;
  handsLive.forEach(h=>{
    if(!h)return;
    const frozen=Date.now()<h.frozenUntil;
    /* reset semua progres ring tangan ini */
    S.bubbles.forEach(b=>{
      if(b.team!==h.team||b.popped)return;
      if(b._dwOwner===h&&(!near(b,h)||frozen)){b._dwOwner=null;if(b.circ)b.circ.style.strokeDashoffset=CIRC;}
    });
    if(frozen)return;
    const b=nearBubble(h);
    if(!b)return;
    if(b._dwOwner!==h){b._dwOwner=h;h._dwStart=now;}
    const prog=(now-h._dwStart)/DWELL_MS;
    if(b.circ)b.circ.style.strokeDashoffset=String(CIRC*(1-clamp(prog,0,1)));
    if(prog>=1){b._dwOwner=null;if(b.circ)b.circ.style.strokeDashoffset=CIRC;popBubble(b,h.team);}
  });
}
function near(b,h){
  const c=bubbleCenter(b);
  const rad=Math.max(26,c.rad+14);
  return (h.x-c.x)*(h.x-c.x)+(h.y-c.y)*(h.y-c.y)<=rad*rad;
}
function nearBubble(h){
  let best=null,bd=Infinity;
  S.bubbles.forEach(b=>{
    if(b.team!==h.team||b.popped)return;
    const c=bubbleCenter(b);
    const d=(h.x-c.x)*(h.x-c.x)+(h.y-c.y)*(h.y-c.y);
    const rad=Math.max(26,c.rad+14);
    if(d<=rad*rad&&d<bd){bd=d;best=b;}
  });
  return best;
}
